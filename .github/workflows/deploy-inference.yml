name: Deploy Inference Pipeline

on:
  push:
    branches: [main]
    paths:
      - "inference/**"
      - "shared/**"
      - "infra/app.py"
      - "infra/stacks/inference_stack.py"
      - ".github/workflows/deploy-inference.yml"
  workflow_dispatch:

concurrency:
  group: cdk-deploy-inference
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          pip install pytest
          pip install -r inference/requirements.txt

      - name: Run tests
        run: |
          set +e
          python -m pytest inference -q
          code=$?
          [ "$code" -eq 5 ] && { echo "No tests collected"; exit 0; }
          exit "$code"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install CDK dependencies
        run: pip install -r infra/requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: CDK deploy inference stack
        working-directory: infra
        run: cdk deploy BasesLoadedInference --require-approval never
